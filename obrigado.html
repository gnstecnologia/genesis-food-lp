<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Obrigado | Genesis Food</title>
<link rel="icon" href="./wp-content/uploads/2025/10/logo-genesis-g-favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  :root { --black:#000; --white:#fff; --muted:#8e8e8e; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Montserrat", sans-serif;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(0,0,0,.06), transparent 45%),
      linear-gradient(180deg, #f7f7f7 0%, #ffffff 55%, #efefef 100%);
    color: var(--black);
    padding: 32px 20px;
    text-align: center;
  }
  .card {
    width: min(560px, 100%);
  }
  img.logo {
    height: 56px;
    width: auto;
    filter: invert(1);
    margin-bottom: 28px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 800;
    line-height: 1.15;
    margin: 0 0 14px;
    text-transform: uppercase;
  }
  p {
    margin: 0 auto 28px;
    max-width: 42ch;
    font-size: 16px;
    line-height: 1.5;
    color: #333;
  }
  a.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 16px 28px;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="./wp-content/uploads/2025/10/logo-genesis.png" alt="Genesis Company" />
    <h1>Recebemos seu contato</h1>
    <p>Em breve um especialista da Genesis Food entra em contato para o seu diagnóstico. Fique de olho no WhatsApp e no e-mail.</p>
    <a class="btn" href="./index.html">Voltar para o início</a>
  </div>
</body>
</html>
